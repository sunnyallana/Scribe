# Tag-triggered release pipeline.
#
# Push a tag matching `v*.*.*` (or hit "Run workflow" on the Actions
# tab) to build a signed Windows MSI + NSIS installer, then publish
# them as a GitHub Release alongside the auto-updater `latest.json`
# manifest.
#
# Required repository secrets:
#   VITE_SUPABASE_URL              SPA build-time inline
#   VITE_SUPABASE_ANON_KEY         SPA build-time inline
#   VITE_API_URL                   SPA build-time inline (e.g. https://api.scribe.example.com)
#   TAURI_SIGNING_PRIVATE_KEY      base64 contents of apps/desktop/src-tauri/.updater-key
#   TAURI_SIGNING_PRIVATE_KEY_PASSWORD  password used at keygen (empty if none)
#
# Linux + macOS jobs are stubbed in but commented; flip them on when
# you stage tectonic for those triples and have signing certs / a
# notarization flow.

name: Release

on:
  push:
    tags: ['v*.*.*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    name: Windows installer
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11.1.3
          run_install: false

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri

      - name: Stage tectonic
        shell: pwsh
        run: |
          $ver = '0.16.0'
          $zip = "tectonic-$ver-x86_64-pc-windows-msvc.zip"
          $url = "https://github.com/tectonic-typesetting/tectonic/releases/download/tectonic@$ver/$zip"
          $tmp = Join-Path $env:RUNNER_TEMP $zip
          Invoke-WebRequest -Uri $url -OutFile $tmp
          $dest = 'apps/desktop/src-tauri/resources'
          New-Item -ItemType Directory -Path $dest -Force | Out-Null
          Expand-Archive -Path $tmp -DestinationPath $dest -Force
          if (-not (Test-Path "$dest/tectonic.exe")) {
            throw "tectonic.exe missing after extraction"
          }

      - name: Install workspace
        env:
          CI: 'true'
        run: pnpm install --frozen-lockfile

      - name: Write .env
        shell: pwsh
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          VITE_API_URL: ${{ secrets.VITE_API_URL }}
        run: |
          @"
          VITE_SUPABASE_URL=$env:VITE_SUPABASE_URL
          VITE_SUPABASE_ANON_KEY=$env:VITE_SUPABASE_ANON_KEY
          VITE_API_URL=$env:VITE_API_URL
          "@ | Out-File -FilePath .env -Encoding utf8

      - name: Build installers
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: pnpm --filter @scribe/desktop tauri build

      - name: Upload installers
        uses: actions/upload-artifact@v4
        with:
          name: scribe-windows-installers
          if-no-files-found: error
          path: |
            apps/desktop/src-tauri/target/release/bundle/msi/*.msi
            apps/desktop/src-tauri/target/release/bundle/nsis/*.exe
            apps/desktop/src-tauri/target/release/bundle/nsis/*.exe.sig
            apps/desktop/src-tauri/target/release/bundle/msi/*.msi.sig

  # build-macos:
  #   name: macOS DMG
  #   runs-on: macos-latest
  #   ... (enable once tectonic-darwin is staged + Apple signing certs in secrets)

  # build-linux:
  #   name: Linux AppImage + deb
  #   runs-on: ubuntu-latest
  #   ... (enable once tectonic-linux is staged)

  publish-release:
    name: Publish GitHub Release
    needs: [build-windows]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Compose `latest.json` for the auto-updater
        # The updater plugin in apps/desktop/src-tauri/tauri.conf.json
        # points at this exact filename on the latest release. The
        # signed `.sig` files produced by `tauri build` go inline.
        shell: bash
        run: |
          set -euo pipefail
          ver="${GITHUB_REF_NAME#v}"
          nsis_exe=$(ls artifacts/scribe-windows-installers/*.exe | head -n1)
          nsis_sig="${nsis_exe}.sig"
          if [ ! -f "$nsis_sig" ]; then
            echo "missing $nsis_sig — signed builds require TAURI_SIGNING_PRIVATE_KEY"
            exit 1
          fi
          sig_contents=$(cat "$nsis_sig")
          cat > latest.json <<EOF
          {
            "version": "$ver",
            "notes": "See release notes on GitHub.",
            "pub_date": "$(date -u +%Y-%m-%dT%H:%M:%SZ)",
            "platforms": {
              "windows-x86_64": {
                "signature": "$sig_contents",
                "url": "https://github.com/${{ github.repository }}/releases/download/${{ github.ref_name }}/$(basename "$nsis_exe")"
              }
            }
          }
          EOF
          cat latest.json

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          draft: true
          generate_release_notes: true
          files: |
            artifacts/scribe-windows-installers/**/*
            latest.json
